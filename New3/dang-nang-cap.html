<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đang Nâng Cấp - Trạm Chữa Lành</title>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,500;1,600&family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --navy-950: #0c1b2e; --navy-800: #1a365d; --burgundy: #7a1c3d;
        --ivory: #f7f5f1; --gray-600: #5b6572; --white: #ffffff;
        --serif: "Lora", "Times New Roman", serif;
        --sans: "Be Vietnam Pro", "Segoe UI", sans-serif;
      }
      body {
        margin: 0; min-height: 100vh;
        font-family: var(--sans); background: var(--ivory);
        display: flex; justify-content: center; align-items: center;
        text-align: center; padding: 20px;
      }
      .notice-card {
        background: var(--white); padding: 50px 40px;
        border-radius: 12px; max-width: 480px;
        box-shadow: 0 20px 40px rgba(12, 27, 46, 0.06);
        border: 1px solid #e9e5de;
      }
      .icon { font-size: 3em; margin-bottom: 20px; }
      h1 {
        font-family: var(--serif); color: var(--navy-800);
        font-size: 2em; margin: 0 0 16px;
      }
      p {
        color: var(--gray-600); font-size: 1.05em; line-height: 1.7;
        margin: 0 0 32px;
      }
      .btn-return {
        display: inline-block; background: var(--navy-800); color: var(--white);
        text-decoration: none; padding: 12px 32px; border-radius: 30px;
        font-weight: 600; letter-spacing: 0.5px; transition: 0.3s;
      }
      .btn-return:hover {
        background: var(--burgundy); transform: translateY(-2px);
      }
    </style>
  </head>
  <body>
    <div class="notice-card">
      <div class="icon">🌿</div>
      <h1>Đang Dọn Dẹp</h1>
      <p>Góc nhỏ này đang được chuẩn bị để mang đến cho bạn một không gian riêng tư trọn vẹn nhất. Bạn quay lại sau một thời gian nữa nhé.</p>
      <a href="index.html" class="btn-return">Quay về trạm chính</a>
    </div>
  </body>
</html>
